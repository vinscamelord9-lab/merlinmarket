<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Top-Up Center</title>
    <style>
        /* Core Black and Pink Theme */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        header {
            background-color: #000000;
            border-bottom: 3px solid #ff1493;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ff1493;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Live Elements Section */
        .live-stats {
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
            border-bottom: 1px solid #333;
        }

        .online-counter {
            color: #00ff00;
            font-weight: bold;
        }

        .purchase-ticker {
            color: #ff69b4;
            font-style: italic;
        }

        /* Product Grid */
        .category-title {
            padding: 20px;
            color: #ff1493;
            border-left: 5px solid #ff1493;
            margin: 20px;
            background: #1a1a1a;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 0 20px 40px 20px;
        }

        .product-card {
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: #ff1493;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            transform: translateY(-5px);
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .price-old {
            text-decoration: line-through;
            color: #666;
            font-size: 14px;
        }

        .price-new {
            color: #ff1493;
            font-size: 22px;
            font-weight: bold;
            margin: 5px 0;
        }

        .buy-btn {
            background-color: #ff1493;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .buy-btn:hover {
            background-color: #ff69b4;
        }

        /* Admin Section Placeholder */
        .admin-login {
            max-width: 350px;
            margin: 50px auto;
            background: #121212;
            padding: 30px;
            border-top: 4px solid #ff1493;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .admin-login input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>Premium Top-Up</h1>
    </header>

    <div class="live-stats">
        <div class="online-counter">🟢 <span id="userCount">142</span> Users Online</div>
        <div class="purchase-ticker" id="tickerText">Waiting for live orders...</div>
    </div>

    <!-- Product Category: TikTok -->
    <div class="category-title">TikTok Coins</div>
    <div class="grid-container">
        <div class="product-card">
            <div class="item-name">350 Coins</div>
            <div class="price-old">₦ 9,350.00</div>
            <div class="price-new">₦ 8,500.00</div>
            <button class="buy-btn">Order Now</button>
        </div>
        <div class="product-card">
            <div class="item-name">700 Coins</div>
            <div class="price-old">₦ 19,250.00</div>
            <div class="price-new">₦ 17,500.00</div>
            <button class="buy-btn">Order Now</button>
        </div>
    </div>

    <!-- Product Category: MLBB -->
    <div class="category-title">Mobile Legends (Diamonds)</div>
    <div class="grid-container">
        <div class="product-card">
            <div class="item-name">50 + 5 Diamonds</div>
            <div class="price-old">₦ 1,169.28</div>
            <div class="price-new">₦ 1,062.98</div>
            <button class="buy-btn">Order Now</button>
        </div>
        <div class="product-card">
            <div class="item-name">78 + 8 Bonus</div>
            <div class="price-old">₦ 1,832.93</div>
            <div class="price-new">₦ 1,666.30</div>
            <button class="buy-btn">Order Now</button>
        </div>
    </div>

    <!-- Admin Login Section -->
    <div class="admin-login" id="adminPanel">
        <h2 style="text-align: center; color: #ff1493;">Admin Gateway</h2>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button class="buy-btn" onclick="checkAdmin()">Login</button>
        <p id="adminError" style="color: red; text-align: center; display: none; margin-top: 10px;">Access Denied.</p>
    </div>

    <script>
        // 1. Dynamic Live Online Counter
        let baseUsers = 140;
        setInterval(() => {
            // Fluctuates user count up or down slightly to simulate traffic
            let fluctuation = Math.floor(Math.random() * 7) - 3; 
            baseUsers = baseUsers + fluctuation;
            if (baseUsers < 85) baseUsers = 85; // Keeps a minimum floor
            document.getElementById('userCount').innerText = baseUsers;
        }, 3000); // Updates every 3 seconds

        // 2. Live Purchase Ticker (Updates every 5 seconds)
        const fakeNames = ["James", "Amina", "David", "Chidera", "Samuel", "Fatima", "Tobi", "Grace"];
        const fakeItems = ["350 TikTok Coins", "78 MLBB Diamonds", "Blood Strike 500 Gold", "DLS 25 Premium Pass", "Delta Force 420 Coins"];
        
        setInterval(() => {
            const randomName = fakeNames[Math.floor(Math.random() * fakeNames.length)];
            const randomItem = fakeItems[Math.floor(Math.random() * fakeItems.length)];
            // Generates a masked phone number like 080****5678
            const hiddenNumber = "0" + (Math.floor(Math.random() * 2) + 7) + "0****" + Math.floor(1000 + Math.random() * 9000);
            
            document.getElementById('tickerText').innerText = 
                `🔥 New Order: ${randomName} (${hiddenNumber}) just bought ${randomItem}!`;
        }, 5000); // Updates every 5 seconds

        // 3. Basic Admin Authentication
        function checkAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === "Merlin" && pass === "merlin1") {
                alert("Welcome back, Merlin. Accessing dashboard...");
                // In a real app, this would redirect to the actual admin dashboard
                document.getElementById('adminError').style.display = 'none';
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
