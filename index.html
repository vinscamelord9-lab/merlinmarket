<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Top-Up Center | Instant Gaming Credits</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #09090b; /* Very dark zinc */
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(236, 72, 153, 0.2); /* Pink border */
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.7);
        }
        .neon-shadow {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #be185d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ec4899; }

        /* Pop-in animation for live purchase */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInUp 0.4s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialProducts = [
            {
                id: 1,
                name: "Free Fire 1080 Diamonds",
                category: "Games",
                price: 8200,
                badge: "Hot",
                image: "https://upload.wikimedia.org/wikipedia/en/e/e6/Free_Fire_logo.svg"
            },
            {
                id: 2,
                name: "CODM 880 CP",
                category: "Games",
                price: 5500,
                badge: "Popular",
                image: "https://upload.wikimedia.org/wikipedia/en/3/36/Call_of_Duty_Mobile_logo.png"
            },
            {
                id: 3,
                name: "PUBG 660 UC",
                category: "Games",
                price: 6000,
                badge: "Sale",
                image: "https://upload.wikimedia.org/wikipedia/en/5/53/PlayerUnknown%27s_Battlegrounds_Mobile_logo.png"
            },
            {
                id: 4,
                name: "TikTok 1000 Coins",
                category: "Social",
                price: 12500,
                badge: "Instant",
                image: "https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg"
            },
            {
                id: 5,
                name: "eFootball 1050 Coins",
                category: "Games",
                price: 9000,
                badge: "Best Seller",
                image: "https://upload.wikimedia.org/wikipedia/en/6/60/EFootball_logo.png"
            },
            {
                id: 6,
                name: "Roblox 800 Robux",
                category: "Games",
                price: 7500,
                badge: "",
                image: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg"
            }
        ];

        const fakeNames = ['Daniel', 'Chinedu', 'Sarah', 'Tobi', 'Samuel', 'Jessica', 'David', 'Miracle', 'Emmanuel', 'Joy', 'Victor', 'Aisha', 'Ibrahim', 'Michael', 'Esther'];

        function App() {
            const [products, setProducts] = useState(initialProducts);
            const [searchTerm, setSearchTerm] = useState("");
            const [activeCategory, setActiveCategory] = useState("All");
            
            // Live Stats State
            const [liveUsers, setLiveUsers] = useState(104523);
            const [livePurchase, setLivePurchase] = useState(null);

            // Checkout State
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [checkoutStep, setCheckoutStep] = useState("hidden"); // hidden, verify, payment, reviewing
            const [uid, setUid] = useState("");
            const [whatsapp, setWhatsapp] = useState("");
            const [senderName, setSenderName] = useState("");
            const [timeLeft, setTimeLeft] = useState(900); // 15 mins in seconds

            // Admin State
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminUser, setAdminUser] = useState("");
            const [adminPass, setAdminPass] = useState("");

            // --- Effects for Fake Live Data ---
            useEffect(() => {
                // Fluctuate live users every 2 seconds
                const userInterval = setInterval(() => {
                    setLiveUsers(prev => prev + (Math.floor(Math.random() * 21) - 8)); 
                }, 2000);

                // Show fake purchases every 6-10 seconds
                const purchaseInterval = setInterval(() => {
                    const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                    const prod = initialProducts[Math.floor(Math.random() * initialProducts.length)];
                    setLivePurchase(`${name} just bought ${prod.name} for ₦${prod.price.toLocaleString()}`);
                    
                    // Hide toast after 4 seconds
                    setTimeout(() => {
                        setLivePurchase(null);
                    }, 4000);
                }, Math.floor(Math.random() * 4000) + 6000);

                return () => {
                    clearInterval(userInterval);
                    clearInterval(purchaseInterval);
                };
            }, []);

            // --- Timer Effect ---
            useEffect(() => {
                let timer;
                if (checkoutStep === "reviewing" && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [checkoutStep, timeLeft]);

            // --- Handlers ---
            const handleBuyClick = (product) => {
                setSelectedProduct(product);
                setCheckoutStep("verify");
                setUid("");
                setWhatsapp("");
                setSenderName("");
                setTimeLeft(900);
            };

            const handleVerifySubmit = (e) => {
                e.preventDefault();
                if (uid && whatsapp) {
                    setCheckoutStep("payment");
                }
            };

            const handlePaymentSubmit = (e) => {
                e.preventDefault();
                if (senderName) {
                    setCheckoutStep("reviewing");
                }
            };

            const closeCheckout = () => {
                setCheckoutStep("hidden");
                setSelectedProduct(null);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminUser === "merlin" && adminPass === "merlin16") {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                } else {
                    alert("Invalid Admin Credentials");
                }
            };

            // Filters
            const filteredProducts = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCat = activeCategory === "All" || p.category === activeCategory;
                return matchesSearch && matchesCat;
            });

            // Timer Formatting
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="min-h-screen relative pb-20">
                    {/* Header */}
                    <header className="sticky top-0 z-40 glass-panel border-b-0 border-b-pink-600/30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl font-black tracking-wider text-pink-500 neon-text">OFFICIAL<span className="text-white">STORE</span></span>
                            </div>
                            
                            {/* LIVE USERS PILL */}
                            <div className="flex items-center gap-2 bg-pink-900/40 border border-pink-500/50 px-3 py-1 rounded-full">
                                <div className="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></div>
                                <span className="text-xs font-bold text-pink-100">{liveUsers.toLocaleString()} Live Users</span>
                            </div>

                            <button onClick={() => setShowAdminLogin(true)} className="text-xs text-gray-400 hover:text-pink-400">
                                {isAdmin ? "Dashboard" : "Admin Login"}
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    {!isAdmin ? (
                        <main className="max-w-7xl mx-auto px-4 pt-6">
                            {/* Banner */}
                            <div className="rounded-2xl bg-gradient-to-r from-pink-900/60 to-purple-900/60 p-6 md:p-10 mb-8 border border-pink-500/30 neon-shadow relative overflow-hidden">
                                <div className="absolute top-0 right-0 opacity-10 text-9xl">🎮</div>
                                <div className="relative z-10">
                                    <h1 className="text-3xl md:text-5xl font-black text-white mb-3">Instant Gaming Top-Up</h1>
                                    <p className="text-pink-200 text-sm md:text-lg max-w-xl">Get your Free Fire Diamonds, CODM CP, and PUBG UC instantly. Official and secure delivery to your Player UID.</p>
                                </div>
                            </div>

                            {/* Search & Categories */}
                            <div className="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
                                <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-2">
                                    {['All', 'Games', 'Social'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setActiveCategory(cat)}
                                            className={`px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                                                activeCategory === cat 
                                                ? 'bg-pink-600 text-white shadow-[0_0_10px_rgba(236,72,153,0.5)]' 
                                                : 'bg-zinc-900 text-gray-400 border border-zinc-800 hover:border-pink-500/50'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Search games..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full md:w-72 bg-zinc-900/80 border border-zinc-700 focus:border-pink-500 rounded-xl px-4 py-2.5 text-sm outline-none text-white transition-all"
                                />
                            </div>

                            {/* Product Grid */}
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                                {filteredProducts.map(product => (
                                    <div key={product.id} className="glass-panel rounded-2xl p-4 flex flex-col hover:border-pink-500/80 transition-all hover:transform hover:-translate-y-1">
                                        <div className="relative mb-4 flex justify-center items-center bg-zinc-900/50 rounded-xl p-4 h-32">
                                            <img src={product.image} alt={product.name} className="max-h-full max-w-full object-contain drop-shadow-xl" />
                                            {product.badge && (
                                                <span className="absolute top-2 left-2 bg-pink-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">
                                                    {product.badge}
                                                </span>
                                            )}
                                        </div>
                                        <h3 className="font-bold text-sm text-gray-100 mb-1">{product.name}</h3>
                                        <div className="mt-auto pt-3 flex items-center justify-between">
                                            <span className="text-lg font-black text-pink-400">₦{product.price.toLocaleString()}</span>
                                        </div>
                                        <button 
                                            onClick={() => handleBuyClick(product)}
                                            className="w-full mt-3 bg-pink-600 hover:bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wide transition-colors"
                                        >
                                            Order Now
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </main>
                    ) : (
                        /* Admin Dashboard */
                        <div className="max-w-4xl mx-auto p-6 mt-6 glass-panel rounded-2xl">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold text-pink-500">Admin Control Center</h2>
                                <button onClick={() => setIsAdmin(false)} className="text-xs bg-red-900/50 text-red-400 px-3 py-1 rounded">Exit Admin</button>
                            </div>
                            <p className="text-gray-400 text-sm mb-4">Welcome Merlin. Manage your products here.</p>
                            
                            <div className="bg-zinc-900/80 rounded-xl border border-zinc-700 p-4">
                                <h3 className="font-bold text-white mb-4">Product Catalog</h3>
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="text-gray-400 border-b border-zinc-700">
                                            <th className="pb-2">Name</th>
                                            <th className="pb-2">Category</th>
                                            <th className="pb-2">Price</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {products.map(p => (
                                            <tr key={p.id} className="border-b border-zinc-800/50">
                                                <td className="py-2 text-white font-medium">{p.name}</td>
                                                <td className="py-2 text-gray-400">{p.category}</td>
                                                <td className="py-2 text-pink-400 font-bold">₦{p.price.toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* LIVE PURCHASE TOAST */}
                    {livePurchase && (
                        <div className="toast-enter fixed bottom-6 left-4 md:left-6 z-50 glass-panel border-l-4 border-l-pink-500 p-3 rounded-lg flex items-center gap-3 shadow-2xl max-w-xs">
                            <div className="bg-pink-900/50 p-2 rounded-full text-pink-400">
                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg>
                            </div>
                            <p className="text-xs text-gray-200 font-medium leading-tight">{livePurchase}</p>
                        </div>
                    )}

                    {/* MODALS */}
                    
                    {/* Admin Login Modal */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-6 relative">
                                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
                                <h3 className="text-lg font-bold text-white mb-4">Admin Authentication</h3>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="text-xs text-gray-400">Username</label>
                                        <input type="text" required value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-white mt-1 outline-none focus:border-pink-500" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400">Password</label>
                                        <input type="password" required value={adminPass} onChange={e => setAdminPass(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-white mt-1 outline-none focus:border-pink-500" />
                                    </div>
                                    <button type="submit" className="w-full bg-pink-600 text-white font-bold py-2.5 rounded-lg mt-2">Login</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Multi-Step Checkout Modal */}
                    {checkoutStep !== "hidden" && selectedProduct && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-panel border-pink-500/50 w-full max-w-md rounded-2xl p-6 relative neon-shadow">
                                {checkoutStep !== "reviewing" && (
                                    <button onClick={closeCheckout} className="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
                                )}

                                {/* STEP 1: Verify Details */}
                                {checkoutStep === "verify" && (
                                    <div>
                                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-zinc-800">
                                            <img src={selectedProduct.image} className="w-12 h-12 object-contain bg-zinc-900 rounded p-1" />
                                            <div>
                                                <h3 className="text-white font-bold">{selectedProduct.name}</h3>
                                                <p className="text-pink-400 font-black">₦{selectedProduct.price.toLocaleString()}</p>
                                            </div>
                                        </div>
                                        
                                        <h4 className="text-sm font-bold text-gray-300 mb-4">Step 1: Account Verification</h4>
                                        <form onSubmit={handleVerifySubmit} className="space-y-4">
                                            <div>
                                                <label className="text-xs text-gray-400 uppercase tracking-wider font-bold">Player UID / Game ID *</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    placeholder="Enter your exact Game ID"
                                                    value={uid}
                                                    onChange={e => setUid(e.target.value)} 
                                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-white mt-1 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all" 
                                                />
                                                <p className="text-[10px] text-pink-400 mt-1">Make sure this is 100% correct to avoid delivery to wrong account.</p>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 uppercase tracking-wider font-bold">WhatsApp Number *</label>
                                                <input 
                                                    type="tel" 
                                                    required 
                                                    placeholder="For receipt & status updates"
                                                    value={whatsapp}
                                                    onChange={e => setWhatsapp(e.target.value)} 
                                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-white mt-1 focus:border-pink-500 outline-none transition-all" 
                                                />
                                            </div>
                                            <button type="submit" className="w-full bg-pink-600 hover:bg-pink-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider mt-4 transition-colors">
                                                Proceed to Payment
                                            </button>
                                        </form>
                                    </div>
                                )}

                                {/* STEP 2: Bank Payment Details */}
                                {checkoutStep === "payment" && (
                                    <div>
                                        <div className="text-center mb-5">
                                            <div className="w-10 h-10 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-2">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                            <h3 className="text-lg font-bold text-white">UID Verified</h3>
                                            <p className="text-xs text-gray-400">Target UID: <span className="text-pink-400 font-mono">{uid}</span></p>
                                        </div>

                                        <div className="bg-zinc-900 border border-pink-600/30 p-5 rounded-xl mb-5">
                                            <p className="text-xs text-gray-400 font-bold uppercase tracking-widest mb-3 text-center">Transfer Exactly</p>
                                            <p className="text-3xl font-black text-pink-500 text-center mb-4">₦{selectedProduct.price.toLocaleString()}</p>
                                            
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between border-b border-zinc-800 pb-2">
                                                    <span className="text-gray-500">Bank Name:</span>
                                                    <span className="text-white font-bold">MOMO PSB</span>
                                                </div>
                                                <div className="flex justify-between border-b border-zinc-800 pb-2 pt-1">
                                                    <span className="text-gray-500">Account Number:</span>
                                                    <span className="text-pink-400 font-black text-lg tracking-wider">7048972368</span>
                                                </div>
                                                <div className="flex justify-between pt-1">
                                                    <span className="text-gray-500">Account Name:</span>
                                                    <span className="text-white font-bold">OGUNLANA JAMIU</span>
                                                </div>
                                            </div>
                                        </div>

                                        <form onSubmit={handlePaymentSubmit}>
                                            <label className="text-xs text-gray-400 uppercase tracking-wider font-bold">Sender's Name on Receipt *</label>
                                            <input 
                                                type="text" 
                                                required 
                                                placeholder="Name used for transfer"
                                                value={senderName}
                                                onChange={e => setSenderName(e.target.value)} 
                                                className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-white mt-1 mb-4 focus:border-pink-500 outline-none" 
                                            />
                                            <button type="submit" className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider transition-colors shadow-[0_0_15px_rgba(22,163,74,0.4)]">
                                                I Have Paid
                                            </button>
                                        </form>
                                    </div>
                                )}

                                {/* STEP 3: Reviewing / Timer */}
                                {checkoutStep === "reviewing" && (
                                    <div className="text-center py-6">
                                        <div className="relative w-24 h-24 mx-auto mb-6">
                                            {/* Spinning Ring */}
                                            <div className="absolute inset-0 rounded-full border-4 border-zinc-800"></div>
                                            <div className="absolute inset-0 rounded-full border-4 border-pink-500 border-t-transparent animate-spin"></div>
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <span className="text-2xl">⏳</span>
                                            </div>
                                        </div>
                                        
                                        <h3 className="text-xl font-black text-white mb-2">Reviewing Payment</h3>
                                        <p className="text-gray-400 text-sm mb-6 max-w-[250px] mx-auto">
                                            We are confirming your transfer from <span className="text-white font-bold">{senderName}</span>. 
                                            Credits will be sent to UID <span className="text-pink-400 font-mono">{uid}</span> shortly.
                                        </p>

                                        <div className="bg-zinc-900 rounded-xl p-4 border border-zinc-800 mb-6 flex flex-col items-center">
                                            <span className="text-xs text-gray-500 uppercase font-bold tracking-widest mb-1">Estimated Time</span>
                                            <span className={`text-4xl font-black font-mono tracking-widest ${timeLeft < 300 ? 'text-red-500' : 'text-pink-500'}`}>
                                                {formatTime(timeLeft)}
                                            </span>
                                        </div>

                                        <button onClick={closeCheckout} className="text-xs text-gray-400 hover:text-white underline">
                                            Close Window (Processing continues in background)
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
