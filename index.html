<div id="adminTab-paymentSettings" class="admin-tab-content hidden space-y-3">
            <h4 class="text-base font-bold text-white">Bank Account Configuration</h4>
            <div>
              <label class="block text-slate-400 mb-1">Bank Name</label>
              <input type="text" id="adminBankName" value="OPay" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Account Number</label>
              <input type="text" id="adminAccountNo" value="7048972368" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Account Name</label>
              <input type="text" id="adminAccountName" value="OGUNLANA JAMIU" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white">
            </div>
            <button onclick="saveBankSettings()" class="py-2.5 px-5 rounded-xl bg-pink-500 hover:bg-pink-400 text-black font-extrabold text-xs transition">
              Save Bank Details
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
  // ================= CATALOG DATA =================
  const gamesData = [
    {
      id: "pubg",
      title: "PUBG Mobile",
      category: "Battle Royale",
      image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=60",
      badge: "Direct Credit",
      packages: [
        { name: "60 UC", price: 1200 },
        { name: "325 UC", price: 6000 },
        { name: "660 UC", price: 12000 },
        { name: "1800 UC", price: 32000 },
        { name: "3850 UC", price: 65000 }
      ]
    },
    {
      id: "freefire",
      title: "Free Fire",
      category: "Battle Royale",
      image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500&auto=format&fit=crop&q=60",
      badge: "Direct Credit",
      packages: [
        { name: "100 Diamonds", price: 1500 },
        { name: "310 Diamonds", price: 4200 },
        { name: "520 Diamonds", price: 7000 },
        { name: "1060 Diamonds", price: 13500 }
      ]
    },
    {
      id: "codm",
      title: "Call of Duty: Mobile",
      category: "Battle Royale",
      image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500&auto=format&fit=crop&q=60",
      badge: "Direct Credit",
      packages: [
        { name: "80 CP", price: 1300 },
        { name: "420 CP", price: 6500 },
        { name: "880 CP", price: 13000 },
        { name: "2400 CP", price: 33000 }
      ]
    },
    {
      id: "efootball",
      title: "eFootball 2026",
      category: "Sports",
      image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500&auto=format&fit=crop&q=60",
      badge: "Direct Credit",
      packages: [
        { name: "130 Coins", price: 1800 },
        { name: "550 Coins", price: 7200 },
        { name: "1040 Coins", price: 13500 },
        { name: "2130 Coins", price: 26000 }
      ]
    },
    {
      id: "mlbb",
      title: "Mobile Legends",
      category: "Sports",
      image: "https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=500&auto=format&fit=crop&q=60",
      badge: "Direct Credit",
      packages: [
        { name: "86 Diamonds", price: 1400 },
        { name: "257 Diamonds", price: 4000 },
        { name: "706 Diamonds", price: 10500 }
      ]
    }
  ];

  let selectedGame = null;
  let selectedPkg = null;
  let currentProofFile = null;
  let shareCount = 0;
  const totalSharesRequired = 5;

  let ordersDB = JSON.parse(localStorage.getItem('naijacp_orders') || '[]');

  // ================= RENDER STORE CATALOG =================
  function renderGames(filter = 'all') {
    const grid = document.getElementById('gamesGrid');
    if (!grid) return;
    
    const filtered = filter === 'all' 
      ? gamesData 
      : gamesData.filter(g => g.category === filter);

    grid.innerHTML = filtered.map(game => `
      <div onclick="openTopupModal('${game.id}')" class="glass-card p-4 rounded-3xl cursor-pointer flex flex-col justify-between group">
        <div>
          <div class="relative overflow-hidden rounded-2xl mb-3 aspect-square bg-slate-900">
            <img src="${game.image}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute top-2 left-2 text-[9px] font-black uppercase px-2 py-0.5 rounded bg-pink-500/80 text-black border border-pink-400">
              ${game.badge}
            </span>
          </div>
          <h3 class="font-bold text-sm text-white truncate">${game.title}</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">${game.category}</p>
        </div>
        <button class="mt-4 w-full py-2.5 rounded-xl bg-pink-500/10 border border-pink-500/30 text-pink-400 font-extrabold text-xs group-hover:bg-pink-500 group-hover:text-black transition">
          Top Up Now
        </button>
      </div>
    `).join('');
  }

  function filterCategory(category) {
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.classList.remove('bg-pink-500', 'text-black', 'active');
      btn.classList.add('bg-slate-900/80', 'text-slate-400');
    });
    if (event) {
      event.currentTarget.classList.remove('bg-slate-900/80', 'text-slate-400');
      event.currentTarget.classList.add('bg-pink-500', 'text-black', 'active');
    }
    renderGames(category);
  }

  // ================= MODAL CONTROLS =================
  function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('hidden');
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('hidden');
  }

  // ================= TOP-UP SELECTION =================
  function openTopupModal(gameId) {
    selectedGame = gamesData.find(g => g.id === gameId);
    if (!selectedGame) return;

    document.getElementById('modalGameImg').src = selectedGame.image;
    document.getElementById('modalGameTitle').textContent = selectedGame.title;
    document.getElementById('modalGameBadge').textContent = selectedGame.badge;
    document.getElementById('playerIdInput').value = '';
    document.getElementById('selectedPriceDisplay').textContent = '₦0';
    selectedPkg = null;

    const pkgContainer = document.getElementById('packagesContainer');
    pkgContainer.innerHTML = selectedGame.packages.map((pkg, idx) => `
      <div onclick="selectPkg(${idx})" id="pkg-card-${idx}" class="package-card p-3 rounded-2xl bg-slate-950 border border-slate-800 cursor-pointer text-center hover:border-pink-500/50">
        <p class="text-xs font-bold text-white">${pkg.name}</p>
        <p class="text-pink-400 font-extrabold text-sm mt-1">₦${pkg.price.toLocaleString()}</p>
      </div>
    `).join('');

    openModal('topupModal');
  }

  function selectPkg(index) {
    document.querySelectorAll('.package-card').forEach(card => card.classList.remove('selected'));
    const card = document.getElementById(`pkg-card-${index}`);
    if (card) card.classList.add('selected');
    
    selectedPkg = selectedGame.packages[index];
    document.getElementById('selectedPriceDisplay').textContent = `₦${selectedPkg.price.toLocaleString()}`;
  }

  function proceedToCheckout() {
    const playerId = document.getElementById('playerIdInput').value.trim();
    if (!playerId) {
      alert('Please enter your Player ID / Character ID!');
      return;
    }
    if (!selectedPkg) {
      alert('Please select a top-up package!');
      return;
    }

    document.getElementById('checkoutItem').textContent = `${selectedGame.title} ${selectedPkg.name}`;
    document.getElementById('checkoutTarget').textContent = playerId;
    document.getElementById('checkoutAmount').textContent = `₦${selectedPkg.price.toLocaleString()}`;

    closeModal('topupModal');
    openModal('paymentModal');
  }

  // ================= PAYMENT & PROOF SUBMISSION =================
  function copyAccountNumber() {
    const accNo = document.getElementById('accountNumber').textContent;
    navigator.clipboard.writeText(accNo);
    alert('Account number copied to clipboard!');
  }

  function handleProofUpload(e) {
    const file = e.target.files[0];
    if (file) {
      currentProofFile = file;
      document.getElementById('uploadPlaceholder').classList.add('hidden');
      document.getElementById('uploadPreview').classList.remove('hidden');
      document.getElementById('proofFileName').textContent = file.name;
    }
  }

  function submitOrderWithProof() {
    if (!currentProofFile) {
      alert('Please upload your transfer payment screenshot proof before submitting.');
      return;
    }

    const playerId = document.getElementById('checkoutTarget').textContent;
    const refCode = 'NCP-' + Math.floor(100000 + Math.random() * 900000);
    
    const newOrder = {
      ref: refCode,
      game: selectedGame ? selectedGame.title : 'Game Top-Up',
      pkg: selectedPkg ? selectedPkg.name : 'Package',
      playerId: playerId,
      amount: selectedPkg ? selectedPkg.price : 0,
      proofName: currentProofFile.name,
      status: 'Pending Verification',
      date: new Date().toLocaleString()
    };

    ordersDB.unshift(newOrder);
    localStorage.setItem('naijacp_orders', JSON.stringify(ordersDB));

    document.getElementById('receiptRef').textContent = newOrder.ref;
    document.getElementById('receiptGame').textContent = newOrder.game;
    document.getElementById('receiptPkg').textContent = newOrder.pkg;
    document.getElementById('receiptAmount').textContent = `₦${newOrder.amount.toLocaleString()}`;

    closeModal('paymentModal');
    openModal('receiptModal');
    
    currentProofFile = null;
    document.getElementById('uploadPlaceholder').classList.remove('hidden');
    document.getElementById('uploadPreview').classList.add('hidden');
    document.getElementById('proofFileInput').value = '';
  }

  // ================= FREE FIRE SENSI GENERATOR =================
  function shareToWhatsApp() {
    shareCount++;
    const left = Math.max(0, totalSharesRequired - shareCount);
    const progressPercent = Math.min(100, (shareCount / totalSharesRequired) * 100);

    document.getElementById('sharesLeft').textContent = left;
    document.getElementById('taskProgressText').textContent = `${shareCount}/${totalSharesRequired} Shares`;
    document.getElementById('progressBar').style.width = `${progressPercent}%`;

    const shareMsg = encodeURIComponent("Check out NAIJACP.NG for instant game top-ups and free Headshot Sensi generator!");
    window.open(`https://api.whatsapp.com/send?text=${shareMsg}`, '_blank');

    if (shareCount >= totalSharesRequired) {
      setTimeout(() => {
        document.getElementById('taskContainer').classList.add('hidden');
        document.getElementById('sensiFormContainer').classList.remove('hidden');
      }, 1000);
    }
  }

  function generateSensiCode() {
    const model = document.getElementById('phoneModelInput').value.trim();
    if (!model) {
      alert('Please enter your phone model!');
      return;
    }

    const code = 'FF-' + Math.floor(1000 + Math.random() * 9000) + '-SENSI';
    document.getElementById('generatedCode').textContent = code;
    document.getElementById('valGeneral').textContent = Math.floor(90 + Math.random() * 10);
    document.getElementById('valRedDot').textContent = Math.floor(85 + Math.random() * 12);
    document.getElementById('val2x').textContent = Math.floor(80 + Math.random() * 15);
    document.getElementById('val4x').textContent = Math.floor(80 + Math.random() * 15);

    document.getElementById('sensiResultContainer').classList.remove('hidden');
  }

  function copySensiCode() {
    const code = document.getElementById('generatedCode').textContent;
    navigator.clipboard.writeText(code);
    alert('Sensitivity code copied!');
  }

  // ================= ORDER TRACKER =================
  function openTrackerModal() {
    document.getElementById('trackerInput').value = '';
    document.getElementById('trackerResult').classList.add('hidden');
    openModal('trackerModal');
  }

  function searchOrder() {
    const query = document.getElementById('trackerInput').value.trim().toUpperCase();
    const resContainer = document.getElementById('trackerResult');
    
    if (!query) return;

    const found = ordersDB.find(o => o.ref.toUpperCase() === query || o.playerId === query);

    resContainer.classList.remove('hidden');
    if (found) {
      resContainer.innerHTML = `
        <div class="p-4 rounded-2xl bg-slate-950 border border-pink-500/30 text-xs space-y-2">
          <div class="flex justify-between text-slate-400"><span>Ref Code:</span><span class="text-white font-mono font-bold">${found.ref}</span></div>
          <div class="flex justify-between text-slate-400"><span>Item:</span><span class="text-white">${found.game} - ${found.pkg}</span></div>
          <div class="flex justify-between text-slate-400"><span>Player ID:</span><span class="text-white font-mono">${found.playerId}</span></div>
          <div class="flex justify-between text-slate-400"><span>Amount:</span><span class="text-pink-400 font-bold">₦${found.amount.toLocaleString()}</span></div>
          <div class="flex justify-between border-t border-slate-800 pt-2">
            <span class="text-slate-400">Status:</span>
            <span class="text-amber-400 font-bold uppercase">${found.status}</span>
          </div>
        </div>
      `;
    } else {
      resContainer.innerHTML = `
        <div class="p-4 rounded-2xl bg-red-500/10 border border-red-500/30 text-xs text-red-400 text-center font-bold">
          No order found matching "${query}". Please check your Reference Code or Player ID.
        </div>
      `;
    }
  }

  // ================= ADMIN PORTAL =================
  function promptAdminPassword() {
    document.getElementById('adminUserInput').value = '';
    document.getElementById('adminPassInput').value = '';
    document.getElementById('adminAuthError').classList.add('hidden');
    openModal('adminAuthModal');
  }

  function verifyAdminPassword() {
    const user = document.getElementById('adminUserInput').value.trim();
    const pass = document.getElementById('adminPassInput').value.trim();

    if (user === 'Merlin' && pass === 'merlin1') {
      closeModal('adminAuthModal');
      openModal('adminModal');
      renderAdminOrders();
    } else {
      document.getElementById('adminAuthError').classList.remove('hidden');
    }
  }

  function toggleAdminNavDrawer() {
    const drawer = document.getElementById('adminNavDrawer');
    drawer.classList.toggle('hidden');
  }

  function switchAdminTab(tabName) {
    document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
    const activeTab = document.getElementById(`adminTab-${tabName}`);
    if (activeTab) activeTab.classList.remove('hidden');
  }

  function renderAdminOrders() {
    const list = document.getElementById('adminOrdersList');
    if (!list) return;

    if (ordersDB.length === 0) {
      list.innerHTML = `<div class="p-3 bg-slate-900 rounded-xl border border-slate-800 text-slate-400">No new proof uploads submitted yet.</div>`;
      return;
    }

    list.innerHTML = ordersDB.map((ord, i) => `
      <div class="p-3.5 bg-slate-900 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between gap-3 text-xs">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-mono font-bold text-pink-400">${ord.ref}</span>
            <span class="text-[10px] px-2 py-0.5 rounded ${ord.status === 'Completed' ? 'bg-green-500/20 text-green-300' : 'bg-amber-500/20 text-amber-300'} font-bold">${ord.status}</span>
          </div>
          <p class="text-slate-300 mt-1 font-semibold">${ord.game} (${ord.pkg}) - ID: ${ord.playerId}</p>
          <p class="text-slate-500 text-[11px]">Proof: ${ord.proofName} | ${ord.date}</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-white font-extrabold mr-2">₦${ord.amount.toLocaleString()}</span>
          ${ord.status !== 'Completed' ? `<button onclick="approveOrder(${i})" class="px-3 py-1.5 rounded-lg bg-green-500 hover:bg-green-400 text-black font-bold">Approve</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function approveOrder(index) {
    ordersDB[index].status = 'Completed';
    localStorage.setItem('naijacp_orders', JSON.stringify(ordersDB));
    renderAdminOrders();
  }

  function saveBankSettings() {
    const bank = document.getElementById('adminBankName').value;
    const acc = document.getElementById('adminAccountNo').value;
    const name = document.getElementById('adminAccountName').value;

    document.getElementById('accountNumber').textContent = acc;
    alert(`Bank details updated successfully!\nBank: ${bank}\nAcc No: ${acc}\nName: ${name}`);
  }

  // ================= INITIALIZATION =================
  document.addEventListener('DOMContentLoaded', () => {
    renderGames();
  });
</script>

</body>
</html>
