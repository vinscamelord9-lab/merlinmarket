<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERLIN MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#fff}
.topbar{position:sticky;top:0;z-index:10;background:rgba(10,10,15,0.95);border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-family:'Orbitron';font-weight:800;font-size:22px;letter-spacing:2px}
.logo span{color:#00ff88}
.shop-btn{background:#00ff88;color:#000;border:0;padding:8px 16px;border-radius:20px;font-weight:800;cursor:pointer}
.hero{padding:40px 20px;text-align:center}
.hero h1{font-family:'Orbitron';font-size:38px;margin-bottom:10px}
.hero h1 span{color:#00ff88}
.hero p{opacity:0.6;margin-bottom:20px}
.tabs{display:flex;justify-content:center;gap:12px}
.tab{padding:12px 28px;border-radius:30px;border:2px solid #2a2a35;background:#111;font-weight:800;cursor:pointer}
.tab.active{background:#00ff88;color:#000;border-color:#00ff88}
.tab.ff.active{background:#8b5cf6;color:#fff;border-color:#8b5cf6}
.container{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#16161f;border:1px solid #2a2a35;border-radius:20px;overflow:hidden}
.card-img{height:180px;background:#0f0f15;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.card-body{padding:16px}
.card-title{font-weight:800;font-size:17px;margin-bottom:6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meta span{background:#222;padding:3px 8px;border-radius:10px;font-size:11px;opacity:0.8}
.desc{font-size:13px;opacity:0.7;margin-bottom:10px}
.price{font-family:'Orbitron';font-size:20px;color:#00ff88;font-weight:800;margin-bottom:12px}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
.btn-buy{background:#00ff88;color:#000}
.btn-sec{background:#2a2a35;color:#fff}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:20;text-decoration:none}
#adminPanel{display:none;position:fixed;inset:0;background:#050508;z-index:9999;overflow-y:auto;padding:20px}
.admin-box{max-width:800px;margin:0 auto;background:#11111a;border:1px solid #2a2a35;border-radius:20px;padding:20px}
.input{width:100%;background:#0f0f15;border:1px solid #2a2a35;padding:10px;border-radius:10px;color:#fff;margin-bottom:8px}
label{font-size:11px;opacity:0.6;margin:8px 0 3px;display:block}
.admin-card{background:#0f0f15;border:1px solid #222;padding:12px;border-radius:12px;margin-bottom:10px}
.btn-admin{padding:10px 16px;border-radius:10px;border:0;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">神 <span>MERLIN</span> 모</div>
<button class="shop-btn" onclick="document.querySelector('.container').scrollIntoView({behavior:'smooth'})">SHOP</button>
</div>
<div class="hero">
<h1>MERLIN <span>MARKET</span></h1>
<p>Trusted CPM & Free Fire Accounts • Instant Delivery • WhatsApp Support</p>
<div class="tabs">
<div class="tab active" id="tab-cpm" onclick="filterType('cpm')">🏎️ CPM</div>
<div class="tab" id="tab-ff" onclick="filterType('ff')">🔥 FREE FIRE</div>
</div>
</div>
<div class="container"><div class="grid" id="productGrid"></div></div>
<a id="waFloat" class="wa-float" target="_blank">💬</a>

<div id="adminPanel">
<div id="loginBox" style="max-width:360px;margin:80px auto;background:#11111a;padding:30px;border-radius:20px;border:1px solid #2a2a35;text-align:center">
<h2 style="font-family:Orbitron;margin-bottom:20px">ADMIN LOGIN</h2>
<input id="admUser" class="input" placeholder="Username">
<input id="admPass" class="input" type="password" placeholder="Password">
<button class="btn-admin" style="width:100%;background:#00ff88;margin-top:10px" onclick="doLogin()">LOGIN</button>
<p id="loginErr" style="color:#ff3b3b;display:none;margin-top:10px">Wrong password</p>
</div>
<div id="adminContent" style="display:none">
<div class="admin-box">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>EDIT STORE</h2><button class="btn-admin" style="background:#ff3b3b;color:#fff" onclick="closeAdmin()">✕ Close</button>
</div>
<label>WhatsApp Number (234...)</label><input id="cfgWa" class="input">
<div style="display:flex;justify-content:space-between;margin-top:15px">
<h3>Packages (<span id="prodCount">0</span>)</h3><button class="btn-admin" style="background:#00ff88" onclick="addNewProduct()">+ ADD NEW</button>
</div>
<div id="adminList" style="margin-top:10px"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">
<button class="btn-admin" style="background:#00ff88" onclick="saveAll()">💾 SAVE LOCALLY</button>
<button class="btn-admin" style="background:#8b5cf6;color:#fff" onclick="generateCode()">📋 GENERATE CODE</button>
</div>
<div id="codeBox" style="display:none;margin-top:20px"><textarea id="codeOut" style="width:100%;height:200px;background:#000;color:#0f0;padding:10px;font-size:11px"></textarea><button class="btn-admin" style="background:#00ff88;margin-top:8px" onclick="copyCode()">Copy</button></div>
</div>
</div>
</div>

<script>
const DEFAULT_PRODUCTS=[{"id":1,"type":"cpm","title":"CPM Starter Account","price":5000,"img":"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600","badge":"LEVEL 30+","level":"30","rank":"Beginner","desc":"5M money, clean, no ban"},{"id":2,"type":"cpm","title":"CPM King Account","price":12000,"img":"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600","badge":"LEVEL 80 KING","level":"80","rank":"KING","desc":"20M money, all cars"},{"id":3,"type":"ff","title":"FF Heroic Account","price":15000,"img":"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600","badge":"LVL 68 HEROIC","level":"68","rank":"Heroic","desc":"3 Evo guns, Cobra Rage"},{"id":4,"type":"ff","title":"FF Grandmaster Beast","price":35000,"img":"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600","badge":"LVL 78 GM","level":"78","rank":"Grandmaster","desc":"5 Evo Max, rare bundles"}];
let products=JSON.parse(localStorage.getItem('merlin_products')||'null')||DEFAULT_PRODUCTS;
let config=JSON.parse(localStorage.getItem('merlin_cfg')||'null')||{wa:'2348100000000'};
let currentFilter='cpm';
function render(){
 const grid=document.getElementById('productGrid');
 document.getElementById('waFloat').href='https://wa.me/'+config.wa+'?text=Hello%20Merlin';
 let filtered=products.filter(p=>p.type===currentFilter);
 if(filtered.length===0) filtered=products;
 grid.innerHTML=filtered.map(p=>`<div class="card"><div class="card-img"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/400'"><div class="badge">${p.badge}</div></div><div class="card-body"><div class="card-title">${p.title}</div><div class="meta"><span>LVL ${p.level}</span><span>${p.rank}</span><span>${p.type.toUpperCase()}</span></div><div class="desc">${p.desc}</div><div class="price">₦${Number(p.price).toLocaleString()}</div><div class="actions"><button class="btn btn-buy" onclick="buyNow(${p.id})">BUY NOW</button><button class="btn btn-sec" onclick="shareProd(${p.id})">Share</button></div></div></div>`).join('');
}
function filterType(t){currentFilter=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(t==='ff') document.getElementById('tab-ff').classList.add('ff');render();}
function buyNow(id){const p=products.find(x=>x.id===id);const msg=`Hello Merlin%0AI want to buy ${p.title}%0APrice ₦${p.price}%0ALevel ${p.level} Rank ${p.rank}%0AImg: ${p.img}`;window.open('https://wa.me/'+config.wa+'?text='+msg,'_blank');}
function shareProd(id){const p=products.find(x=>x.id===id);navigator.clipboard.writeText(p.img).then(()=>alert('Image link copied'));}
function openAdmin(){document.getElementById('adminPanel').style.display='block';}
function closeAdmin(){document.getElementById('adminPanel').style.display='none';history.replaceState(null,'',location.pathname);render();}
function doLogin(){if(document.getElementById('admUser').value==='Merlin'&&document.getElementById('admPass').value==='merlin1'){document.getElementById('loginBox').style.display='none';document.getElementById('adminContent').style.display='block';loadAdminForm();}else document.getElementById('loginErr').style.display='block';}
function loadAdminForm(){document.getElementById('cfgWa').value=config.wa;const list=document.getElementById('adminList');list.innerHTML='';products.forEach((p,i)=>{list.innerHTML+=`<div class="admin-card"><div style="display:flex;justify-content:space-between"><strong>#${i+1} ${p.type}</strong><button class="btn-admin" style="background:#ff3b3b;color:#fff;padding:4px 10px" onclick="delProd(${i})">Del</button></div><label>Title</label><input class="input" id="t_${i}" value="${p.title}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Price</label><input class="input" type="number" id="pr_${i}" value="${p.price}"></div><div><label>Type cpm/ff</label><select class="input" id="ty_${i}"><option value="cpm" ${p.type==='cpm'?'selected':''}>cpm</option><option value="ff" ${p.type==='ff'?'selected':''}>ff</option></select></div><div><label>Level</label><input class="input" id="lv_${i}" value="${p.level}"></div><div><label>Rank</label><input class="input" id="rk_${i}" value="${p.rank}"></div></div><label>Badge</label><input class="input" id="b_${i}" value="${p.badge}"><label>Image URL</label><input class="input" id="img_${i}" value="${p.img}"><label>Details</label><input class="input" id="d_${i}" value="${p.desc}"></div>`});document.getElementById('prodCount').innerText=products.length;}
function addNewProduct(){products.push({id:Date.now(),type:'ff',title:'New Account',price:20000,img:'https://via.placeholder.com/400',badge:'NEW',level:'70',rank:'Heroic',desc:'Add details'});loadAdminForm();}
function delProd(i){if(confirm('Delete?')){products.splice(i,1);loadAdminForm();}}
function saveAll(){let np=[];for(let i=0;i<products.length;i++){np.push({id:products[i].id,type:document.getElementById('ty_'+i).value,title:document.getElementById('t_'+i).value,price:parseInt(document.getElementById('pr_'+i).value)||0,img:document.getElementById('img_'+i).value,badge:document.getElementById('b_'+i).value,level:document.getElementById('lv_'+i).value,rank:document.getElementById('rk_'+i).value,desc:document.getElementById('d_'+i).value});}products=np;config.wa=document.getElementById('cfgWa').value.replace(/\D/g,'');localStorage.setItem('merlin_products',JSON.stringify(products));localStorage.setItem('merlin_cfg',JSON.stringify(config));alert('Saved! Now click GENERATE CODE and upload to GitHub');render();}
function generateCode(){saveAll();let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;html=html.replace(/const DEFAULT_PRODUCTS=\[.*?\];/s,'const DEFAULT_PRODUCTS='+JSON.stringify(products)+';');document.getElementById('codeBox').style.display='block';document.getElementById('codeOut').value=html;}
function copyCode(){document.getElementById('codeOut').select();document.execCommand('copy');alert('Copied');}
if(location.hash==='#merlinadmin') openAdmin();
render();
window.addEventListener('hashchange',()=>{if(location.hash==='#merlinadmin') openAdmin();});
</script>
</body>
</html>
