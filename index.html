function renderGames(category = "all") {

function openTopupModal(gameId) {
  currentGame = games.find(game => game.id === gameId);

  if (!currentGame) return;

  selectedPackage = null;

  document.getElementById("modalGameTitle").textContent =

  document.getElementById("modalGameBadge").textContent =
    currentGame.category;

  document.getElementById("modalGameImg").src =
    currentGame.icon;

  document.getElementById("playerIdInput").value = "";

  document.getElementById("selectedPriceDisplay").textContent =
    "₦0";

  const container =
    document.getElementById("packagesContainer");

  container.innerHTML = "";

  currentGame.packages.forEach((pkg, index) => {
    const button = document.createElement("button");

    button.className =
      "package-card bg-slate-950 border border-slate-800 rounded-2xl p-3 text-left hover:border-pink-500 transition";

    button.innerHTML = `

}


function selectPackage(pkg, element) {
  selectedPackage = pkg;

  document.querySelectorAll(".package-card")
    .forEach(card => card.classList.remove("selected"));

  element.classList.add("selected");

  document.getElementById("selectedPriceDisplay").textContent =
    "₦" + formatMoney(pkg.price);
}


/* =========================================================

   ========================================================= */

function proceedToCheckout() {
  const playerId =
    document.getElementById("playerIdInput").value.trim();

  if (!playerId) {
    alert("Please enter your Player ID / Character ID.");
    return;
  }

  if (!selectedPackage) {
    alert("Please select a package.");
    return;
  }

  document.getElementById("checkoutItem").textContent =
    `${currentGame.title} ${selectedPackage.name}`;

  document.getElementById("checkoutTarget").textContent =
    playerId;

  document.getElementById("checkoutAmount").textContent =
    "₦" + formatMoney(selectedPackage.price);

  closeModal("topupModal");
  openModal("paymentModal");
}


/* =========================================================

   ========================================================= */

function handleProofUpload(event) {
  const file = event.target.files[0];

  if (!file) return;

  uploadedProof = file;

  document.getElementById("uploadPlaceholder")
    .classList.add("hidden");

  document.getElementById("uploadPreview")
    .classList.remove("hidden");

  document.getElementById("proofFileName")
    .textContent = file.name;
}


/* =========================================================
   SUBMIT ORDER
   ========================================================= */

function submitOrderWithProof() {
  const playerId =
    document.getElementById("playerIdInput").value.trim();

  if (!playerId) {
    alert("Player ID is missing.");
    return;
  }

  if (!selectedPackage || !currentGame) {
    alert("Please select a package first.");
    return;
  }

  if (!uploadedProof) {
    alert("Please upload your payment screenshot.");
    return;
  }

  const orderRef =
    "NCP-" +
    Math.floor(100000 + Math.random() * 900000);

  const order = {
    ref: orderRef,
    game: currentGame.title,
    gameId: currentGame.id,
    package: selectedPackage.name,
    amount: selectedPackage.price,
    playerId: playerId,
    status: "Pending Verification",
    proofName: uploadedProof.name,
    createdAt: new Date().toISOString()
  };

  const orders =
    JSON.parse(localStorage.getItem("naijacp_orders") || "[]");

  orders.unshift(order);

  localStorage.setItem(
    "naijacp_orders",
    JSON.stringify(orders)
  );

  document.getElementById("receiptRef").textContent =
    orderRef;

  document.getElementById("receiptGame").textContent =
    currentGame.title;

  document.getElementById("receiptPkg").textContent =
    selectedPackage.name;

  document.getElementById("receiptAmount").textContent =
    "₦" + formatMoney(selectedPackage.price);

  closeModal("paymentModal");

  openModal("receiptModal");

  uploadedProof = null;

  document.getElementById("proofFileInput").value = "";

  document.getElementById("uploadPlaceholder")
    .classList.remove("hidden");

  document.getElementById("uploadPreview")
    .classList.add("hidden");

  renderAdminOrders();
}

function renderAdminOrders() {

  if (!orders.length) {

    return;

  container.innerHTML = "";

  orders.forEach(order => {

    const item = document.createElement("div");

    item.className =
      "p-4 bg-slate-900 rounded-2xl border border-slate-800";

    item.innerHTML = `
      <div class="flex items-start justify-between gap-3">

        <div>
          <p class="text-white font-bold">
            ${order.game}

          <p class="text-slate-400 mt-1">

            ₦${formatMoney(order.amount)}

        </div>

        <span class="text-[10px] px-2 py-1 rounded-lg
          bg-amber-500/10 text-amber-400 border border-amber-500/20">
          ${order.status}

      </div>

            onclick="updateOrderStatus('${order.ref}', 'Approved')"
            class="px-3 py-2 rounded-lg bg-green-500/10 text-green-400 border border-green-500/20 text-xs font-bold">
            Approve

            class="px-3 py-2 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold">
            Reject
          </button>

        </div>

      </div>
    `;

    container.appendChild(item);
  });
}


function updateOrderStatus(ref, status) {
  const orders =
    JSON.parse(localStorage.getItem("naijacp_orders") || "[]");

  const order = orders.find(o => o.ref === ref);

  if (!order) return;

  order.status = status;

  localStorage.setItem(
    "naijacp_orders",
    JSON.stringify(orders)
  );

  renderAdminOrders();

  alert(`Order ${ref} marked as ${status}.`);
}

      document.getElementById("adminAccountName").value.trim()

    "naijacp_payment_settings",
    JSON.stringify(settings)
  );

  applyPaymentSettings();

  alert("Bank payment settings saved.");

function applyPaymentSettings() {

  const settings =
    JSON.parse(
      localStorage.getItem("naijacp_payment_settings") || "null"
    );

  if (!settings) return;

  const account =
    document.getElementById("accountNumber");

  if (account) {
    account.textContent = settings.accountNumber;
  }

  const bankElements =
    document.querySelectorAll(".payment-bank-name");

  bankElements.forEach(el => {
    el.textContent = settings.bankName;
  });
}

let shareCount = 0;


function shareToWhatsApp() {

  if (shareCount >= 5) return;

  const message =
    "Check out NAIJACP.NG gaming top-ups 🇳🇬";

  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");

  shareCount++;

  document.getElementById("sharesLeft").textContent =
    Math.max(0, 5 - shareCount);

  document.getElementById("taskProgressText").textContent =
    `${shareCount}/5 Shares`;

  document.getElementById("progressBar").style.width =
    `${(shareCount / 5) * 100}%`;

  if (shareCount >= 5) {

    document.getElementById("taskContainer")
      .classList.add("hidden");

    document.getElementById("sensiFormContainer")
      .classList.remove("hidden");
  }
}


function generateSensiCode() {

  const phone =
    document.getElementById("phoneModelInput")
      .value.trim();

  const ram =
    document.getElementById("phoneRamInput").value;

  if (!phone) {
    alert("Please enter your phone model.");
    return;
  }

  let base = 90;

  if (ram === "2GB") base = 82;
  if (ram === "3GB") base = 86;
  if (ram === "4GB") base = 90;
  if (ram === "6GB") base = 94;
  if (ram === "8GB") base = 96;
  if (ram === "12GB") base = 98;

  const general =
    Math.min(100, base + randomNumber(-2, 2));

  const redDot =
    Math.min(100, base + randomNumber(-4, 2));

  const twoX =
    Math.min(100, base + randomNumber(-6, 0));

  const fourX =
    Math.min(100, base + randomNumber(-8, -2));

  const code =
    "FF-" +
    Math.floor(1000 + Math.random() * 9000) +
    "-SENSI";

  document.getElementById("generatedCode").textContent =
    code;

  document.getElementById("valGeneral").textContent =
    general;

  document.getElementById("valRedDot").textContent =
    redDot;

  document.getElementById("val2x").textContent =
    twoX;

  document.getElementById("val4x").textContent =
    fourX;

  document.getElementById("sensiResultContainer")
    .classList.remove("hidden");
}


function copySensiCode() {

  const code =
    document.getElementById("generatedCode")
      .textContent;

  navigator.clipboard.writeText(code)
    .then(() => alert("Sensi code copied!"))
    .catch(() => alert("Unable to copy code."));
}


/* =========================================================
   MODAL HELPERS
   ========================================================= */

function openModal(id) {
  const modal = document.getElementById(id);

  if (modal) {
    modal.classList.remove("hidden");
    document.body.classList.add("overflow-hidden");
  }
}


function closeModal(id) {
  const modal = document.getElementById(id);

  if (modal) {
    modal.classList.add("hidden");
  }

  const anyOpen =
    document.querySelector(
      ".fixed.inset-0:not(.hidden)"
    );

  if (!anyOpen) {
    document.body.classList.remove("overflow-hidden");
  }
}


/* =========================================================
   COPY FUNCTIONS
   ========================================================= */

function copyAccountNumber() {

  const account =
    document.getElementById("accountNumber")
      .textContent;

  navigator.clipboard.writeText(account)
    .then(() => alert("Account number copied!"))
    .catch(() => alert("Unable to copy account number."));
}


/* =========================================================
   UTILITIES
   ========================================================= */

function formatMoney(number) {
  return Number(number).toLocaleString("en-NG");
}


function randomNumber(min, max) {
  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;
}


function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/* =========================================================

document.addEventListener("DOMContentLoaded", () => {

  setInterval(showPurchaseToast, 25000);

});


/* =========================================================
   ESC KEY CLOSES MODALS
   ========================================================= */

document.addEventListener("keydown", event => {

  if (event.key !== "Escape") return;

  document.querySelectorAll(".fixed.inset-0")
    .forEach(modal => {

      if (!modal.classList.contains("hidden")) {
        modal.classList.add("hidden");
      }

    });

  document.body.classList.remove("overflow-hidden");
});
